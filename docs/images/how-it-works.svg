<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1350 250" width="1350" height="250" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5f6b7a"/></marker></defs>
<rect width="1350" height="250" rx="18" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="675.0" y="44" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2328">How the split works</text>
<rect x="40" y="70" width="220" height="110" rx="14" fill="#fff" stroke="#fb8c00" stroke-width="2.5"/>
<rect x="40" y="70" width="220" height="8" rx="4" fill="#fb8c00"/>
<text x="150.0" y="118" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2328">Device power</text>
<text x="150.0" y="144" text-anchor="middle" font-size="13.5" fill="#57606a">smart plug</text>
<text x="150.0" y="162" text-anchor="middle" font-size="13.5" fill="#57606a">e.g. 1.2 kW</text>
<line x1="266" y1="125.0" x2="384" y2="125.0" stroke="#5f6b7a" stroke-width="2.2" marker-end="url(#a)"/>
<text x="325.0" y="113.0" text-anchor="middle" font-size="12.5" fill="#57606a"></text>
<rect x="390" y="70" width="220" height="110" rx="14" fill="#fff" stroke="#546e7a" stroke-width="2.5"/>
<rect x="390" y="70" width="220" height="8" rx="4" fill="#546e7a"/>
<text x="500.0" y="118" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2328">Grid power</text>
<text x="500.0" y="144" text-anchor="middle" font-size="13.5" fill="#57606a">house meter</text>
<text x="500.0" y="162" text-anchor="middle" font-size="13.5" fill="#57606a">+ import / − export</text>
<line x1="616" y1="125.0" x2="734" y2="125.0" stroke="#5f6b7a" stroke-width="2.2" marker-end="url(#a)"/>
<text x="675.0" y="113.0" text-anchor="middle" font-size="12.5" fill="#57606a"></text>
<rect x="740" y="70" width="220" height="110" rx="14" fill="#fff" stroke="#03a9f4" stroke-width="2.5"/>
<rect x="740" y="70" width="220" height="8" rx="4" fill="#03a9f4"/>
<text x="850.0" y="118" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2328">Solar Load Split</text>
<text x="850.0" y="144" text-anchor="middle" font-size="13.5" fill="#57606a">grid_used = min(import, device)</text>
<text x="850.0" y="162" text-anchor="middle" font-size="13.5" fill="#57606a">pv_used = device − grid_used</text>
<line x1="966" y1="125.0" x2="1084" y2="125.0" stroke="#5f6b7a" stroke-width="2.2" marker-end="url(#a)"/>
<text x="1025.0" y="113.0" text-anchor="middle" font-size="12.5" fill="#57606a">kW / kWh</text>
<rect x="1090" y="70" width="220" height="110" rx="14" fill="#fff" stroke="#43a047" stroke-width="2.5"/>
<rect x="1090" y="70" width="220" height="8" rx="4" fill="#43a047"/>
<text x="1200.0" y="118" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2328">12 sensors</text>
<text x="1200.0" y="144" text-anchor="middle" font-size="13.5" fill="#57606a">PV / grid power</text>
<text x="1200.0" y="162" text-anchor="middle" font-size="13.5" fill="#57606a">energy day…year</text>
<text x="675.0" y="228" text-anchor="middle" font-size="13" font-style="italic" fill="#6e7781">Example: device 1.2 kW, grid import 0.4 kW → 0.4 kW grid + 0.8 kW PV</text>
</svg>